<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilliss IT has moved to lilliss.au</title>
<link rel="canonical" href="https://lilliss.au/">
<meta http-equiv="refresh" content="0; url=https://lilliss.au/">
<meta name="robots" content="noindex,follow">
<meta name="description" content="Lilliss IT now lives at lilliss.au.">
<!-- Retired 26/08/2026, restored 27/08/2026 after I clobbered it.

     This path served the Lilliss IT business page until lilliss.au went live.
     It is a redirect, not a deletion: links to it may already exist and a 404
     would strand them.

     ⚠ HOW IT WAS CLOBBERED, so nobody repeats it: a width-cap fix batch copied
     business/lillissit-site-v2/index.html into this path, because that mapping
     was true BEFORE this file became a redirect. The copy silently restored the
     full business page here, and for a while two URLs served two different
     business pages again - the exact problem central ruled on.

     THE SOURCE MAPPING FOR THIS PATH IS NOW: none. Nothing builds into it.
     lilliss.au is served from jaredlilliss/lilliss-au, which is central's repo
     and not this one. Do not copy the business source here.

     Three layers, because each catches a different reader:
       rel=canonical  -> search engines
       meta refresh   -> ordinary browsers, immediately
       a visible link -> JS off, refresh blocked, or a text browser
     No JavaScript, so nothing here can fail silently. -->
<style>
  :root{color-scheme:dark}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:2rem;
    background:#0F1216;color:#E8EAED;
    font:400 16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    text-align:center;
  }
  .brand{
    font:500 12px/1 ui-monospace,"Cascadia Code",Consolas,monospace;
    letter-spacing:.22em;text-transform:uppercase;color:#8A9099;margin-bottom:1.75rem;
  }
  .brand b{color:#F2A65A;font-weight:500}
  h1{
    font:600 clamp(1.6rem,1.1rem + 2vw,2.4rem)/1.15 Georgia,"Times New Roman",serif;
    margin:0 0 1rem;letter-spacing:-.01em;
  }
  p{margin:0 0 1.75rem;color:#A8AEB6;max-width:46ch}
  a.go{
    display:inline-block;padding:.8rem 1.5rem;border-radius:999px;
    background:#F2A65A;color:#0F1216;text-decoration:none;font-weight:600;
    transition:transform .2s ease,background .2s ease;
  }
  a.go:hover{background:#F7BC7E;transform:translateY(-1px)}
  a.go:focus-visible{outline:2px solid #F2A65A;outline-offset:3px}
  small{display:block;margin-top:1.75rem;color:#6E747C;font-size:13px}
</style>
</head>
<body>
  <main>
    <p class="brand">Lilliss <b>IT</b></p>
    <h1>This page has moved.</h1>
    <p>Lilliss IT now lives at its own address. You should arrive there
       automatically &mdash; if not, the link below will take you.</p>
    <a class="go" href="https://lilliss.au/">Go to lilliss.au</a>
    <small>Previously jaredlilliss.github.io/lilliss-it/</small>
  </main>
</body>
</html>
