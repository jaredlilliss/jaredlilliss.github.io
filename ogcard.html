<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<style>

@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/fonts/fraunces.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;
  src:url('/fonts/fraunces-italic.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/fonts/inter.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('/fonts/plexmono-400.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
  src:url('/fonts/plexmono-500.woff2') format('woff2')}

html{font-optical-sizing:auto}
</style>
<style>

:root{
  --bg:#05070d; --bg2:#090d17; --ink:#eceff5; --muted:#8d96aa;
  --ember:#ff8c4a; --aurora:#1d5c52;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:radial-gradient(120% 100% at 78% 105%, #10453c 0%, #0a2b28 26%, #070d18 58%, #05070d 100%);
  color:var(--ink);font-family:var(--sans);position:relative;
}
canvas{position:absolute;inset:0;width:1200px;height:630px}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px}
.sig{font-family:var(--mono);font-size:19px;letter-spacing:.20em;text-transform:uppercase;color:var(--ink)}
.sig b{color:var(--ember);font-weight:500}
h1{font-family:var(--serif);font-weight:600;font-size:82px;line-height:.98;letter-spacing:-.022em;max-width:16ch}
h1 em{font-style:italic;color:var(--ember)}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.foot p{color:var(--muted);font-size:22px;line-height:1.45;max-width:46ch}
.chips{display:flex;gap:10px;flex-shrink:0}
.chip{font-family:var(--mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border:1px solid rgba(141,150,170,.32);padding:9px 14px;white-space:nowrap}
.rule{height:1px;background:linear-gradient(90deg,var(--ember),rgba(141,150,170,.18) 42%,transparent);margin-bottom:26px}
</style></head>
<body>
<canvas id="sky" width="1200" height="630"></canvas>
<div class="wrap">
  <div class="sig">Jared <b>Lilliss</b></div>
  <div>
    <div class="rule"></div>
    <h1>I build things that keep running <em>after I go home.</em></h1>
  </div>
  <div class="foot">
    <p>Sydney field technician and builder — data pipelines that survive reboots,
       single-file sites that work offline, automation with receipts.</p>
    <div class="chips"><span class="chip">jaredlilliss.github.io</span></div>
  </div>
</div>
<script>
/* the same seeded starfield idea the site uses, drawn once — deterministic */
(function(){
  var c=document.getElementById('sky'),x=c.getContext('2d'),W=1200,H=630;
  function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
  var r=rng(20260824),i;
  for(i=0;i<220;i++){
    var sx=r()*W, sy=r()*H*0.72, z=0.3+r()*0.7;
    x.globalAlpha=0.16+0.5*z*(1-sy/(H*0.9));
    x.fillStyle='#cfe6ff';
    x.fillRect(sx,sy,1.5*z,1.5*z);
  }
  x.globalAlpha=1;
  /* one ember trace, low right — the site's accent as a horizon glow */
  var g=x.createRadialGradient(980,600,0,980,600,420);
  g.addColorStop(0,'rgba(255,140,74,.20)');g.addColorStop(1,'rgba(255,140,74,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
})();
</script>
</body></html>
